name: AnyRouter AWS 签到

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 开启调试模式（截图 artifact、详细日志）
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aws-checkin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkin:
    if: github.repository == 'Rancemxn/anyrouter-check-in' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checkin.yml
    with:
      runner: aws-main
      debug: ${{ inputs.debug || false }}
    secrets: inherit
