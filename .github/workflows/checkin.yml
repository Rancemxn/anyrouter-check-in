name: AgentRouter 会话恢复准备
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  seal-existing-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: python -m pip install cryptography==46.0.3
      - name: Seal existing configuration
        env:
          ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        run: python scripts/seal_account_config.py
